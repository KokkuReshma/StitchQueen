[FAQ]
question_1 = What are your working hours?
answer_1 = We are open Monday to Saturday from 9 AM to 6 PM, and Sundays from 11 AM to 4 PM.

question_2 = How long does tailoring take?
answer_2 = Custom designs typically take 2-4 weeks depending on complexity and current workload.

question_3 = Do you offer home visits?
answer_3 = Yes, we offer home visits for measurement and consultation. Call us to schedule.

question_4 = What is your return policy?
answer_4 = We offer free alterations within the first month. Custom items are non-returnable unless there's a defect.

question_5 = Can I rush my order?
answer_5 = Yes, rush orders are available at an additional cost. Contact us for details.

